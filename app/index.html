<!doctype html>
<html lang="en" data-skin="felt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Saturday Signature: theme before paint (stops a light flash on dark devices). Keep before the stylesheets. -->
    <script>try{var t=localStorage.getItem('sat-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
    <!-- Motion: full unless the phone asks for less. Settings, Motion can overrule the phone. -->
    <script>try{var fm=localStorage.getItem('felt-motion');if(fm==='calm'||(fm!=='full'&&matchMedia('(prefers-reduced-motion: reduce)').matches))document.documentElement.setAttribute('data-calm','')}catch(e){}</script>
    <!-- A launch that lands here directly (an icon saved from this page) still plays the opening screen once. A link with a route goes straight in. -->
    <script>try{if(!sessionStorage.getItem('felt-splashed')&&(!location.hash||location.hash==='#/')&&localStorage.getItem('felt-splash-ms')!=='0'){document.documentElement.style.visibility='hidden';location.replace('../')}}catch(e){}</script>
    <!-- A launch with no role chosen yet shows the Start view: its static copy below paints in the first frame, so the load screen's mark has a place to land. -->
    <script>try{if(!sessionStorage.getItem('felt-role')&&(!location.hash||location.hash==='#/'))document.documentElement.classList.add('felt-boot')}catch(e){}</script>
    <link rel="expect" href="#felt-boot" blocking="render" />
    <!-- Home Screen app: the document is taller than the screen by the top inset from the first frame, so iOS does not lay the boot copy (fixed, inset 0) out short. Same rule as src/styles.css. -->
    <style>html{min-height:calc(100% + env(safe-area-inset-top,0px))}</style>
    <meta name="theme-color" content="#1C1E21" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Felt" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
    <title>Felt</title>
  </head>
  <body class="sat">
    <div id="root"></div>
    <div id="felt-boot" aria-hidden="true">
      <div class="felt-page felt-start-view">
        <div class="felt-start-mark">
          <svg class="sat-mark" style="--sat-mark-h:64px" viewBox="-2 -2 68 104" aria-hidden="true">
            <g opacity="0.22"><circle cx="32" cy="26" r="22.5" fill="var(--sat-muted)" stroke="none"/><circle cx="32" cy="26" r="15" stroke="var(--sat-bg)" stroke-width="1.4" opacity="0.85" vector-effect="none"/><path d="M46.72 34.50 L51.49 37.25 M32.00 43.00 L32.00 48.50 M17.28 34.50 L12.51 37.25 M17.28 17.50 L12.51 14.75 M32.00 9.00 L32.00 3.50 M46.72 17.50 L51.49 14.75" style="stroke:var(--sat-bg);stroke-width:5;stroke-linecap:butt;vector-effect:none"/></g>
            <g opacity="0.22"><circle cx="32" cy="74" r="22.5" fill="var(--sat-muted)" stroke="none"/><circle cx="32" cy="74" r="15" stroke="var(--sat-bg)" stroke-width="1.4" opacity="0.85" vector-effect="none"/><path d="M46.72 82.50 L51.49 85.25 M32.00 91.00 L32.00 96.50 M17.28 82.50 L12.51 85.25 M17.28 65.50 L12.51 62.75 M32.00 57.00 L32.00 51.50 M46.72 65.50 L51.49 62.75" style="stroke:var(--sat-bg);stroke-width:5;stroke-linecap:butt;vector-effect:none"/></g>
            <path d="M42.52 47.57 A24 24 0 1 0 32 50 A24 24 0 1 1 21.48 52.43"/>
          </svg>
          <span class="sat-wordmark">Felt</span>
        </div>
        <div class="felt-start-choices">
          <div class="felt-start-choice"><i></i><b>Host</b><span>Run the game and log hands on this phone.</span></div>
          <div class="felt-start-choice"><i></i><b>Player</b><span>Scan the QR code to follow the action and log your hands.</span></div>
        </div>
      </div>
    </div>
    <!-- Oldest phones: old syntax on purpose, so a phone too old for the app can still run this. Floor is in docs/PLAN-v1.2.md. -->
    <script data-floor>
      (function () {
        var css = function (p, v) { try { return window.CSS && CSS.supports(p, v); } catch (e) { return false; } };
        var missing = [];
        if (!window.HTMLDialogElement || !HTMLDialogElement.prototype.showModal) missing.push('pop-up sheets');
        if (typeof structuredClone !== 'function') missing.push('data copies');
        if (!window.crypto || !crypto.subtle || !crypto.randomUUID) missing.push('encryption');
        if (!css('height', '1dvh')) missing.push('screen height units');
        if (!css('color', 'color-mix(in srgb, red, blue)')) missing.push('colour mixing');
        if (!missing.length) return;
        var box = document.createElement('div');
        box.id = 'felt-floor';
        box.setAttribute('role', 'alertdialog');
        box.setAttribute('aria-label', 'This phone cannot run Felt');
        box.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;background:#1C1E21;color:#EBF1F5;padding:32px 24px;font:16px/1.45 -apple-system,Roboto,sans-serif;overflow:auto';
        var line = function (tag, text, style) { var e = document.createElement(tag); e.textContent = text; e.style.cssText = style || 'margin:0 0 14px'; box.appendChild(e); return e; };
        line('h1', 'This phone cannot run Felt', 'margin:0 0 14px;font-size:26px;line-height:1.2');
        line('p', 'Felt needs iOS 16.2 or later, or Chrome 111 or later.');
        line('p', 'This browser does not have: ' + missing.join(', ') + '.');
        line('p', 'Update the phone, or open Felt on a newer phone.');
        var go = line('button', 'Open anyway', 'margin-top:10px;min-height:48px;padding:0 20px;border-radius:14px;border:1px solid #A7B1BD;background:none;color:inherit;font:inherit;font-weight:600');
        go.onclick = function () { box.parentNode.removeChild(box); };
        document.body.appendChild(box);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
