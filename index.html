<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Saturday Signature: theme before paint (stops a light flash on dark devices). Keep before the stylesheets. -->
    <script>try{var t=localStorage.getItem('sat-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
    <meta name="theme-color" content="#0A0F12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Felt" />
    <meta name="description" content="Felt: an offline Texas Hold'em home game tracker." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Felt</title>
  </head>
  <body class="sat">
    <!-- Splash: the outer S draws in one stroke, the inner rings and ticks complete the chips, the name settles, then the page fades and hands over to the app.
         Tap or press a key to skip. -->
    <main class="felt-splash" aria-label="Felt is loading">
      <div class="felt-splash-lockup">
        <svg class="sat-mark felt-splash-mark" viewBox="-2 -2 68 104" aria-hidden="true">
          <path class="s" pathLength="1" d="M42.52 47.57 A24 24 0 1 0 32 50 A24 24 0 1 1 21.48 52.43" />
          <path class="inner" d="M17 26 a15 15 0 1 0 30 0 a15 15 0 1 0 -30 0" />
          <path class="inner inner-b" d="M17 74 a15 15 0 1 0 30 0 a15 15 0 1 0 -30 0" />
          <path class="notch" d="M45.15 39.15 L47.84 41.84 M18.85 39.15 L16.16 41.84 M18.85 12.85 L16.16 10.16 M45.15 12.85 L47.84 10.16" />
          <path class="notch" d="M45.15 87.15 L47.84 89.84 M18.85 87.15 L16.16 89.84 M18.85 60.85 L16.16 58.16 M45.15 60.85 L47.84 58.16" />
        </svg>
        <h1 class="sat-wordmark felt-splash-name">Felt</h1>
      </div>
      <span class="felt-splash-version sat-mono">v__FELT_VERSION__</span>
      <noscript><a class="felt-splash-skip" href="./app/">Open Felt</a></noscript>
    </main>
    <script>
      (function () {
        var reduce = false;
        try { reduce = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
        var left = false;
        function enter() {
          if (left) return;
          left = true;
          document.body.classList.add('is-leaving');
          // replace, not assign: Back from the app should not land on the splash again
          setTimeout(function () { location.replace('./app/' + location.hash); }, reduce ? 0 : 420);
        }
        setTimeout(enter, reduce ? 450 : 2200);
        addEventListener('pointerdown', enter);
        addEventListener('keydown', enter);
      })();
    </script>
    <script type="module" src="/src/landing.ts"></script>
  </body>
</html>
